<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Login — The Gentlemen's Barber</title>
<meta name="description" content="Owner sign-in to manage bookings.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth">
<div id="site-header"></div>
<main>

<section class="sec"><div class="wrap"><h1>Owner Login</h1><p class="sub">Sign in to manage customer bookings.</p>
<form id="auth-form" class="narrow">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div id="auth-msg" role="alert"></div><p></p><button class="btn" type="submit">Sign in</button></form></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
