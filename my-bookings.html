<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings — The Gentlemen's Barber</title>
<meta name="description" content="Look up and manage your barber appointments with your email and phone.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="my-bookings">
<div id="site-header"></div>
<main>

<section class="sec"><div class="wrap"><p class="sub" style="margin:0">Your appointments</p><h1>My Bookings</h1>
<p>Enter the email and phone you used when booking.</p>
<form id="lookup" class="narrow">
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone</label><input id="phone" name="phone" type="tel" required>
<p></p><button class="btn" type="submit">Find bookings</button></form>
<div id="results" class="narrow" style="max-width:640px" aria-live="polite"></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
