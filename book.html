<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment — The Gentlemen's Barber</title>
<meta name="description" content="Pick your service, date and time and book your barber appointment online.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book">
<div id="site-header"></div>
<main>

<section class="sec"><div class="wrap"><p class="sub" style="margin:0">Reservations</p><h1>Book an Appointment</h1>
<h2>1. Choose a service</h2><div id="svc-list" style="max-width:560px"></div>
<h2 style="margin-top:32px">2. Pick a date</h2><div class="cal" id="cal"></div><p class="meta">Closed on Sundays.</p>
<h2 style="margin-top:32px">3. Pick a time</h2><div id="times"></div>
<h2 style="margin-top:32px">4. Your details</h2>
<form id="book-form" class="narrow" novalidate>
<label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required>
<label for="notes">Notes (optional)</label><textarea id="notes" name="notes" rows="3"></textarea>
<div id="book-msg" role="status" aria-live="polite"></div>
<button class="btn" type="submit">Confirm Booking</button>
</form></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
